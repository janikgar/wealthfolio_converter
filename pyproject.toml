[project]
name = "wealthfolio_converter"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.43.67",
    "dotenv>=0.9.9",
    "duckdb>=1.5.4",
    "numpy>=2.5.1",
    "types-boto3[essential]>=1.43.72",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "black>=26.5.1",
    "moto[s3]>=5.2.2",
    "mypy>=2.3.1",
    "pylint[spelling]>=4.0.7",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-local-badge[cov]>=1.3.1",
]

[tool.bandit]
targets = ["."]
exclude_dirs = [".venv", "test"]

[tool.pytest]
addopts = ["--cov=wealthfolio_converter", "--cov-report=html", "--local-badge-output-dir=badges/"]
verbosity_subtests = "1"

[tool.pylint]
main.ignore-patterns = ["^\\.#", "test_.*\\.py"]
"messages control".disable = [
    "bad-inline-option",
    "deprecated-pragma",
    "file-ignored",
    "locally-disabled",
    "raw-checker-failed",
    "suppressed-message",
    "use-implicit-booleaness-not-comparison-to-string",
    "use-implicit-booleaness-not-comparison-to-zero",
    "use-symbolic-message-instead",
    "useless-suppression",
    "logging-fstring-interpolation",
]

[tool.coverage.run]
branch = true

[tool.mypy]
python_version = 3.14
disallow_untyped_calls = true
disallow_untyped_defs = true
exclude = "^tests.*"
cache_dir = ".mypy_cache"
incremental = true
sqlite_cache = true
